[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rgbd-robot-sorting"
version = "0.1.0"
description = "Reproducible instance segmentation, RGB-D localization and simulated robotic sorting research"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "AGPL-3.0-or-later AND MIT"
license-files = ["LICENSE", "LICENSES/*.txt"]
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.8,<6",
  "pybullet==3.2.7",
  "PyYAML>=6,<7",
  "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
learning = ["ultralytics==8.4.212", "torch>=2.0", "torchvision>=0.15"]
dev = ["pytest>=8,<10"]

[project.scripts]
robosort = "robosort.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["robosort*", "core*", "robot*", "simulation*", "perception*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
